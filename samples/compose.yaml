# docker compose file; `version: "3.8"` is the canonical quoted form, but
# plenty of real files omit the quotes and silently become the float 3.8.
version: 3.8
services:
  web:
    image: nginx:1.25
    ports:
      - "8080:80"
    environment:
      TZ: UTC
      DEBUG: off
      WORKERS: 4
      CACHE_TTL: 1e3
      BUILD: 20240101
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: app
volumes:
  db-data: {}
