name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      # The two loaders must agree. libyaml is present on the runners, but the
      # pure-Python path is what many users get, so it is exercised explicitly.
      - name: Both loaders agree
        run: |
          python -c "
          from yaml12bridge import load
          text = 'a: NO\nb: 12:30\nc: 0644\nd: 1e3\n'
          assert load(text, use_c=True) == load(text, use_c=False)
          print('C and pure-Python loaders agree')
          "

      - name: CLI smoke test
        run: |
          yaml12 check samples/
          yaml12 roundtrip samples/
