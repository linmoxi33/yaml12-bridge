[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml12-bridge"
version = "0.1.0"
description = "Read, audit and migrate YAML under the 1.2 Core Schema, on top of PyYAML"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "linmoxi33" }]
keywords = ["yaml", "yaml12", "pyyaml", "migration", "compatibility", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
yaml12 = "yaml12bridge.cli:main"

[project.urls]
Homepage = "https://github.com/linmoxi33/yaml12-bridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::yaml12bridge.loader.VersionMismatchWarning"]
